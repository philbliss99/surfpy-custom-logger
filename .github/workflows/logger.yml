name: Log Buoy Data - Multi-Buoy

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:

jobs:
  log:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data  # <-- FIX: checkout data branch, not main
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests pandas

      - name: Run logger
        run: |
          python logger.py

      - name: Commit and push data
        run: |
          git config user.name "surf-bot"
          git config user.email "bot@surf.local"
          git add -f data/*.csv
          git commit -m "auto log $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push origin data