name: Log Buoy Data - Multi-Buoy

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours, same as before
  workflow_dispatch:

jobs:
  log:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests

      - name: Run multi-buoy logger
        run: |
          python logger.py

      - name: Commit and push
        run: |
          git config user.name "buoy-bot"
          git config user.email "buoy-bot@github.com"
          git add data/*.csv
          git diff --staged --quiet || git commit -m "auto: log 44065 + 46221 + 46053 - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push