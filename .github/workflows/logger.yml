name: Rockaway Logger
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests
          pip install -e .

      - name: Run logger
        run: python logger.py

      - name: Commit log
        run: |
          git config user.name "logger-bot"
          git config user.email "bot@philbliss99.com"
          git add data/rockaway_44065_log.csv
          git diff --staged --quiet || git commit -m "auto log $(date -u -Iseconds)"
          git push
